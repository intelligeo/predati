<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="resources/nouislider.min.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #e8f0f8;
        }
        .ol-control > * {
            background-color: #d4e4f7!important;
            color: #001144!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #001144!important;
        }
        .search-layer-input-search {
            background-color: #d4e4f7!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(180, 210, 240, 0.9)!important;
        } 
        .ol-control {
            background-color: rgba(212, 228, 247, 0.6) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        
        #time-slider-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(212, 228, 247, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0, 17, 68, 0.3);
            z-index: 1000;
            min-width: 400px;
            max-width: 600px;
            transition: all 0.3s ease;
        }
        
        #time-slider-container.collapsed {
            min-width: auto;
            padding: 10px 15px;
        }
        
        #time-slider-container.collapsed .slider-content {
            display: none;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: move;
            user-select: none;
        }
        
        #time-slider-container.collapsed .slider-header {
            margin-bottom: 0;
        }
        
        #time-slider-container h4 {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #001144;
            flex: 1;
        }
        
        #toggle-slider {
            background: none;
            border: none;
            color: #001144;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            transition: transform 0.3s ease;
        }
        
        #toggle-slider:hover {
            background-color: rgba(154, 194, 232, 0.3);
            border-radius: 4px;
        }
        
        #time-slider-container.collapsed #toggle-slider {
            transform: rotate(180deg);
        }
        
        #charts-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(212, 228, 247, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0, 17, 68, 0.3);
            z-index: 1000;
            width: 500px;
            max-height: 600px;
            transition: all 0.3s ease;
        }
        
        #charts-container.collapsed {
            width: auto;
            padding: 10px 15px;
        }
        
        #charts-container.collapsed .charts-content {
            display: none;
        }
        
        .charts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: move;
            user-select: none;
        }
        
        #charts-container.collapsed .charts-header {
            margin-bottom: 0;
        }
        
        #charts-container h4 {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #001144;
            flex: 1;
        }
        
        #toggle-charts {
            background: none;
            border: none;
            color: #001144;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            transition: transform 0.3s ease;
        }
        
        #toggle-charts:hover {
            background-color: rgba(154, 194, 232, 0.3);
            border-radius: 4px;
        }
        
        #charts-container.collapsed #toggle-charts {
            transform: rotate(180deg);
        }
        
        #chart-type-selector {
            margin-bottom: 15px;
        }
        
        #chart-type-selector select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #9ac2e8;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #001144;
            background-color: #f0f7fc;
            cursor: pointer;
        }
        
        #chart-type-selector select:focus {
            outline: none;
            border-color: #001144;
            background-color: #ffffff;
        }
        
        #chart-display {
            width: 100%;
            height: 400px;
            background-color: #ffffff;
            border-radius: 4px;
        }
        
        #time-slider {
            margin: 20px 0;
        }
        
        #time-range-display {
            display: flex;
            justify-content: space-between;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #001144;
            margin-top: 15px;
        }
        
        #time-range-display span {
            font-weight: bold;
        }
        
        .date-selectors {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
        }
        
        .date-selector-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .date-selector-group label {
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #001144;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .date-selector-group input[type="date"] {
            padding: 6px 8px;
            border: 1px solid #9ac2e8;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #001144;
            background-color: #f0f7fc;
        }
        
        .date-selector-group input[type="date"]:focus {
            outline: none;
            border-color: #001144;
            background-color: #ffffff;
        }
        
        #time-range-display {
            display: flex;
            justify-content: space-between;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #001144;
            margin-top: 8px;
        }
        
        #time-range-display span {
            font-weight: bold;
        }
        
        .time-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .time-controls button {
            background-color: #b4d2f0;
            color: #001144;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .time-controls button:hover {
            background-color: #9ac2e8;
        }
        
        .time-controls button:active {
            background-color: #80b2e0;
        }
        </style>
        <title>Predazioni in Ticino</title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
            <div id="charts-container">
                <div class="charts-header">
                    <h4>Statistiche predazioni</h4>
                    <button id="toggle-charts" title="Riduci/Espandi">▼</button>
                </div>
                <div class="charts-content">
                    <div id="chart-type-selector">
                        <select id="chart-type">
                            <option value="species-timeline">Specie predate nel tempo</option>
                            <option value="monthly-totals">Totali mensili</option>
                            <option value="species-distribution">Distribuzione per specie</option>
                            <option value="location-stats">Statistiche per località</option>
                        </select>
                    </div>
                    <div id="chart-display"></div>
                </div>
            </div>
            <div id="time-slider-container">
                <div class="slider-header">
                    <h4>Filtro temporale</h4>
                    <button id="toggle-slider" title="Riduci/Espandi">▼</button>
                </div>
                <div class="slider-content">
                    <div id="time-slider"></div>
                    <div id="time-range-display">
                        <span>Inizio: <strong id="start-date">--</strong></span>
                        <span>Fine: <strong id="end-date">--</strong></span>
                    </div>
                    <div class="date-selectors">
                        <div class="date-selector-group">
                            <label for="date-input-start">Data inizio:</label>
                            <input type="date" id="date-input-start">
                        </div>
                        <div class="date-selector-group">
                            <label for="date-input-end">Data fine:</label>
                            <input type="date" id="date-input-end">
                        </div>
                    </div>
                    <div class="time-controls">
                        <button id="reset-time">Reset</button>
                        <button id="show-all">Mostra tutto</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
<script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:3857','+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +wktext +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="layers/PredazioniTicinoHeatmap_3.js"></script><script src="layers/PredazioniTicinoCasistica_4.js"></script>
        <script src="styles/PredazioniTicinoHeatmap_3_style.js"></script><script src="styles/PredazioniTicinoCasistica_4_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script src="./resources/nouislider.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
        <script src="./resources/time-slider.js"></script>
        <script src="./resources/charts.js"></script>
    </body>
</html>
